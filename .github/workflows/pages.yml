name: Publish report to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # Publish on success AND failure – a red report is more useful than no report.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether GitHub Pages is enabled for this repository
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled; skipping report publication."
          fi
      - name: Resolve the CI run that produced the report
        id: source
        if: steps.pages.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -n "$TRIGGER_RUN_ID" ]; then
            run_id="$TRIGGER_RUN_ID"
          else
            # Manual dispatch: publish the most recent completed CI run on main.
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
              --status completed --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Publishing report from CI run $run_id"
      - name: Download merged report from the CI run
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: site
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
