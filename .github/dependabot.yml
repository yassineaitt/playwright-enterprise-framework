version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript majors are gated by typescript-eslint's peer range; bump deliberately.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep @types/node aligned with the Node LTS in .nvmrc.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
